<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCode Expander</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* Page layout — no canvas, just two panes */
        body {
            overflow: auto;
            height: auto;
            min-height: 100vh;
        }

        .expander-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Re-use header from common.css */
        .expander-body {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            gap: 0;
            overflow: hidden;
            min-height: 0;
        }

        /* Toolbar strip below header */
        .expander-toolbar {
            grid-column: 1 / -1;
            padding: 8px 16px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .expander-toolbar .file-label {
            flex: 1;
            font-size: 13px;
            opacity: 0.7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .expander-toolbar .file-upload-zone {
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            /* Re-uses .file-upload-zone from common.css but compact */
            border: 1px solid var(--border-color);
        }

        button.primary {
            background-color: var(--button-active);
            color: #ffffff;
            border-color: var(--button-active);
        }

        button.primary:hover {
            opacity: 0.9;
            background-color: var(--button-active);
        }

        /* Pane headers */
        .pane-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
        }

        .pane-header .pane-stats {
            font-weight: normal;
            font-size: 12px;
            opacity: 0.7;
        }

        /* Greener comments than the viewer default (other parametric colours are in common.css) */
        :root[data-theme="light"] { --gcode-comment: #2e7d32; }
        :root[data-theme="dark"]  { --gcode-comment: #81c784; }

        /* Input pane */
        .input-pane {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 0;
        }

        /* Code-editor overlay widget */
        .editor-outer {
            flex: 1;
            display: flex;
            overflow: hidden;
            background-color: var(--canvas-bg);
            min-height: 0;
        }

        .editor-line-nums {
            padding: 10px 8px 10px 10px;
            text-align: right;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 17px;
            color: var(--text-color);
            opacity: 0.4;
            user-select: none;
            border-right: 1px solid var(--border-color);
            min-width: 40px;
            overflow: hidden;
            white-space: pre;
            flex-shrink: 0;
        }

        .editor-inner {
            position: relative;
            flex: 1;
            overflow: hidden;
        }

        /* highlight layer and editable textarea share identical metrics */
        .editor-highlight,
        #input-textarea {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: 0;
            padding: 10px 12px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 17px;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
            -moz-tab-size: 4;
            border: none;
            box-sizing: border-box;
            word-wrap: normal;
            overflow-wrap: normal;
        }

        .editor-highlight {
            pointer-events: none;
            z-index: 1;
            background: transparent;
            color: var(--text-color);
        }

        #input-textarea {
            z-index: 2;
            background: transparent;
            color: transparent;
            caret-color: var(--text-color);
            resize: none;
            outline: none;
        }

        #input-textarea::placeholder {
            color: var(--text-color);
            opacity: 0.35;
        }

        /* Output pane */
        .output-pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        #output-container {
            flex: 1;
            overflow: auto;
            background-color: var(--canvas-bg);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 17px;
            min-height: 0;
        }

        #output-content {
            display: flex;
        }

        .gcode-line-numbers {
            color: var(--text-color);
            opacity: 0.4;
            text-align: right;
            padding: 10px 8px 10px 10px;
            user-select: none;
            border-right: 1px solid var(--border-color);
            min-width: 40px;
            white-space: pre;
        }

        .gcode-code {
            flex: 1;
            padding: 10px 12px;
            white-space: pre;
        }

        /* Status bar */
        #status-bar {
            grid-column: 1 / -1;
            padding: 5px 16px;
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            min-height: 26px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status-bar.error   { color: #e57373; }
        #status-bar.success { color: #81c784; }
        #status-bar.warning { color: #ffb74d; }

        /* Warnings panel */
        #warnings-panel {
            display: none;
            grid-column: 1 / -1;
            background-color: rgba(255, 152, 0, 0.1);
            border-top: 1px solid rgba(255, 152, 0, 0.4);
            padding: 8px 16px;
            font-size: 12px;
            max-height: 80px;
            overflow-y: auto;
            color: #e69500;
        }

        #warnings-panel.visible { display: block; }

        /* Empty-state placeholder in output */
        #output-placeholder {
            padding: 40px 24px;
            opacity: 0.5;
            font-style: italic;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        @media (max-width: 768px) {
            .expander-body {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr 1fr;
            }
            .expander-toolbar { flex-wrap: nowrap; overflow-x: auto; }
            .input-pane { border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>
<div class="expander-container">

    <header>
        <h1>🔄 GCode Expander</h1>
        <div class="header-controls">
            <button id="theme-toggle">🌓 Theme</button>
            <a href="index.html">← Back</a>
        </div>
    </header>

    <div class="expander-body">

        <!-- Toolbar -->
        <div class="expander-toolbar">
            <label class="file-upload-zone" id="drop-zone">
                📂 Open file
                <input type="file" id="file-input" accept=".gcode,.nc,.gco,.ngc">
            </label>
            <span class="file-label" id="file-label">No file loaded — or paste G-code in the left pane</span>
            <button id="btn-clear">Clear</button>
            <button id="btn-expand" class="primary" disabled>▶ Expand</button>
            <button id="btn-download" disabled>↓ Download</button>
        </div>

        <!-- Input pane -->
        <div class="input-pane">
            <div class="pane-header">
                <span>Input G-code</span>
                <span class="pane-stats" id="in-stats"></span>
            </div>
            <div class="editor-outer">
                <div class="editor-line-nums" id="input-line-nums">1</div>
                <div class="editor-inner">
                    <pre class="editor-highlight" id="input-highlight" aria-hidden="true"> </pre>
                    <textarea id="input-textarea" spellcheck="false" autocorrect="off" autocapitalize="off"
                        placeholder="Paste parametric G-code here, or open a file above…"></textarea>
                </div>
            </div>
        </div>

        <!-- Output pane -->
        <div class="output-pane">
            <div class="pane-header">
                <span>Expanded G-code</span>
                <span class="pane-stats" id="out-stats"></span>
            </div>
            <div id="output-container">
                <div id="output-content">
                    <p id="output-placeholder">Expanded output will appear here with syntax highlighting…</p>
                </div>
            </div>
        </div>

        <!-- Warnings panel -->
        <div id="warnings-panel"></div>

        <!-- Status bar -->
        <div id="status-bar"></div>

    </div><!-- .expander-body -->
</div><!-- .expander-container -->

<script src="js/gcode-expander.js"></script>
<script>
(function () {
    'use strict';

    // -- Theme ---------------------------------------------------------------

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    document.getElementById('theme-toggle').addEventListener('click', () => {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });

    // -- Element refs --------------------------------------------------------

    const dropZone       = document.getElementById('drop-zone');
    const fileInput      = document.getElementById('file-input');
    const fileLabel      = document.getElementById('file-label');
    const inputTextarea  = document.getElementById('input-textarea');
    const inputHighlight = document.getElementById('input-highlight');
    const inputLineNums  = document.getElementById('input-line-nums');
    const outputContent  = document.getElementById('output-content');
    const outputPlaceholder = document.getElementById('output-placeholder');
    const btnExpand      = document.getElementById('btn-expand');
    const btnDownload    = document.getElementById('btn-download');
    const btnClear       = document.getElementById('btn-clear');
    const statusBar      = document.getElementById('status-bar');
    const warningsPanel  = document.getElementById('warnings-panel');
    const inStats        = document.getElementById('in-stats');
    const outStats       = document.getElementById('out-stats');

    let currentFilename = 'output.expanded.gcode';
    let currentOutput   = '';

    // -- Helpers -------------------------------------------------------------

    function setStatus(msg, type) {
        statusBar.textContent = msg;
        statusBar.className   = type || '';
    }

    function countLines(text) {
        return text ? text.trim().split('\n').length : 0;
    }

    function updateInStats() {
        const n = countLines(inputTextarea.value);
        inStats.textContent = n ? n + ' lines' : '';
    }

    // -- Syntax highlighting ------------------------------------------------

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    // ---- Output highlighter (standard G-code only, sequential pass) --------

    function highlightLine(line) {
        const parenStart = line.indexOf('(');
        const parenEnd   = line.lastIndexOf(')');
        const semiIndex  = line.indexOf(';');
        const parts      = [];

        if (parenStart !== -1 && parenEnd > parenStart) {
            parts.push({ text: line.substring(0, parenStart),           isComment: false });
            parts.push({ text: line.substring(parenStart, parenEnd + 1), isComment: true  });
            parts.push({ text: line.substring(parenEnd + 1),             isComment: false });
        } else if (semiIndex !== -1) {
            parts.push({ text: line.substring(0, semiIndex), isComment: false });
            parts.push({ text: line.substring(semiIndex),    isComment: true  });
        } else {
            parts.push({ text: line, isComment: false });
        }

        return parts.map(part => {
            if (part.isComment) return '<span class="gcode-comment">' + escapeHtml(part.text) + '</span>';
            let code = escapeHtml(part.text);
            code = code.replace(/\$([A-Za-z0-9\/=]+)/g, '<span class="gcode-system">$$$1</span>');
            code = code.replace(/\b([GM])(\d+(?:\.\d+)?)/gi, (_, l, n) =>
                '<span class="' + (l.toUpperCase() === 'G' ? 'gcode-g-code' : 'gcode-m-code') + '">' + l + n + '</span>');
            code = code.replace(/\b(T)(\d+)/gi,               '<span class="gcode-t-code">$1$2</span>');
            code = code.replace(/\b(S)(\d+(?:\.\d+)?)/gi,    '<span class="gcode-s-code">$1$2</span>');
            code = code.replace(/([X])([-+]?\d+(?:\.\d+)?)/gi,'<span class="gcode-x-axis">$1$2</span>');
            code = code.replace(/([Y])([-+]?\d+(?:\.\d+)?)/gi,'<span class="gcode-y-axis">$1$2</span>');
            code = code.replace(/([Z])([-+]?\d+(?:\.\d+)?)/gi,'<span class="gcode-z-axis">$1$2</span>');
            code = code.replace(/([ABCIJK])([-+]?\d+(?:\.\d+)?)/gi,'<span class="gcode-coordinate">$1$2</span>');
            code = code.replace(/([F])(\d+(?:\.\d+)?)/gi,    '<span class="gcode-f-code">$1$2</span>');
            return code;
        }).join('');
    }

    // ---- Input highlighter (parametric constructs + standard G-code) -------
    // Uses a single-pass tokeniser so tokens never overlap or double-highlight.

    // Parametric-aware highlighter lives in gcode-expander.js (shared with the viewers)
    const highlightInputLine = highlightParametricGCodeLine;

    function updateInputHighlight(text) {
        const lines = text.split('\n');
        // Trailing \n keeps pre height in sync with textarea
        inputHighlight.innerHTML = lines.map(highlightInputLine).join('\n') + '\n';
        const n = text.endsWith('\n') ? lines.length - 1 : lines.length;
        inputLineNums.textContent = Array.from({length: Math.max(n, 1)}, (_, i) => i + 1).join('\n');
        inputHighlight.scrollTop  = inputTextarea.scrollTop;
        inputHighlight.scrollLeft = inputTextarea.scrollLeft;
        inputLineNums.scrollTop   = inputTextarea.scrollTop;
    }

    function clearInputHighlight() {
        inputHighlight.innerHTML  = ' ';
        inputLineNums.textContent = '1';
    }

    function renderOutput(text) {
        const lines = text.split('\n');
        // Remove trailing empty line from join
        if (lines[lines.length - 1] === '') lines.pop();

        // Line numbers
        let nums = '';
        let code = '';
        lines.forEach((line, i) => {
            nums += (i + 1) + '\n';
            code += '<div class="gcode-line">' + highlightLine(line) + '</div>';
        });

        outputContent.innerHTML =
            '<div class="gcode-line-numbers">' + escapeHtml(nums) + '</div>' +
            '<div class="gcode-code">' + code + '</div>';
    }

    // -- File loading --------------------------------------------------------

    function loadFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            inputTextarea.value = e.target.result;
            currentFilename = file.name.replace(/(\.[^.]+)$/, '.expanded$1') ||
                              'output.expanded.gcode';
            fileLabel.textContent = file.name;
            clearOutput();
            setStatus('', '');
            updateInputHighlight(e.target.result);
            updateInStats();
            btnExpand.disabled = false;
        };
        reader.readAsText(file);
    }

    fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        loadFile(e.dataTransfer.files[0]);
    });

    inputTextarea.addEventListener('input', () => {
        btnExpand.disabled = !inputTextarea.value.trim();
        updateInputHighlight(inputTextarea.value);
        updateInStats();
        clearOutput();
        setStatus('', '');
    });

    inputTextarea.addEventListener('scroll', () => {
        inputHighlight.scrollTop  = inputTextarea.scrollTop;
        inputHighlight.scrollLeft = inputTextarea.scrollLeft;
        inputLineNums.scrollTop   = inputTextarea.scrollTop;
    });

    // -- Expand --------------------------------------------------------------

    btnExpand.addEventListener('click', () => {
        const text = inputTextarea.value;
        if (!text.trim()) return;

        setStatus('Expanding…', '');
        clearOutput();
        warningsPanel.className = '';
        warningsPanel.textContent = '';

        try {
            const name = fileLabel.textContent !== 'No file loaded — or paste G-code in the left pane'
                ? fileLabel.textContent : 'pasted input';
            const { output, lineCount, warnings } = expandLines(text.split(/\r?\n/), name);

            currentOutput = output;
            renderOutput(output);
            outStats.textContent = lineCount + ' lines';
            btnDownload.disabled = false;

            if (warnings && warnings.length) {
                warningsPanel.innerHTML = '⚠️ ' + warnings.map(escapeHtml).join('<br>⚠️ ');
                warningsPanel.className = 'visible';
                setStatus('Expanded with ' + warnings.length + ' warning(s).', 'warning');
            } else {
                setStatus('Expanded successfully — ' + lineCount + ' motion lines emitted.', 'success');
            }
        } catch (err) {
            setStatus('Error: ' + err.message, 'error');
        }
    });

    // -- Download ------------------------------------------------------------

    btnDownload.addEventListener('click', () => {
        if (!currentOutput) return;
        const blob = new Blob([currentOutput], { type: 'text/plain' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = currentFilename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    });

    // -- Clear ---------------------------------------------------------------

    function clearOutput() {
        currentOutput = '';
        outputContent.innerHTML = '<p id="output-placeholder">Expanded output will appear here with syntax highlighting…</p>';
        outStats.textContent = '';
        btnDownload.disabled = true;
    }

    btnClear.addEventListener('click', () => {
        inputTextarea.value = '';
        fileInput.value     = '';
        fileLabel.textContent = 'No file loaded — or paste G-code in the left pane';
        currentFilename     = 'output.expanded.gcode';
        clearOutput();
        clearInputHighlight();
        setStatus('', '');
        inStats.textContent = '';
        btnExpand.disabled  = true;
        warningsPanel.className   = '';
        warningsPanel.textContent = '';
    });

})();
</script>
</body>
</html>
